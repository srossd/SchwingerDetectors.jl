name: Docs

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

# gh-pages deploy needs write access to repo contents
permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      # Schwinger.jl AND its dependency MPSKitLEMPO are both unregistered, so they
      # must be introduced in a single resolve — otherwise Pkg looks up MPSKitLEMPO
      # in the registry and fails ("has no known versions"). The remaining docs deps
      # (Documenter, MPSKit) then resolve from the registry via instantiate.
      - name: Install documentation dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.add([
              PackageSpec(url = "https://github.com/benjamints/MPSKitLEMPO.jl"),
              PackageSpec(url = "https://github.com/srossd/Schwinger.jl")])
            Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # deploy to gh-pages
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}      # optional SSH deploy key
        run: julia --project=docs docs/make.jl
