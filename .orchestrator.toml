# Written by the research orchestrator. Safe to edit.
[project]
id = "schwingerdetectors-jl"
name = "SchwingerDetectors.jl"
status = "active"

[prefs]
# Uncomment to override the orchestrator's default permission mode for this
# project only. Leave it out and the global default ("auto") applies.
#   auto        - Claude assesses each tool call itself, running low-risk ones
#   default     - every gated call asks you first
#   plan        - read and propose, never execute (good for paper projects)
#   acceptEdits - auto-accept file edits, ask for the rest
# The path boundary and destructive-command escalation apply in every mode.
# permission_mode = "plan"
# Absolute paths outside this directory that agents may write to.
extra_write_paths = []

# Package worktrees this project develops against, e.g.
# [[packages]]
# name = "qcd-tools"
# ref = "feature/higher-rank-tensors"
# developing = true

# [compute]
# Default remote host for submit_job (a host registered in the Hosts panel).
# Omit to run jobs locally. Code is rsynced up on each submit (respecting
# .gitignore); data stays on the remote and results are pulled back (small ones)
# or registered in place (large ones).
# host = "pi"
# remote_workdir = "/home/pi/orchestrator/<built-in function id>"   # default: <scratch_root>/<id>
# data_root = "/data/<built-in function id>"                          # where the remote data lives
#
# For a Slurm host, a marker-defined sbatch template. `fixed` directives are
# LOCKED (the agent can never change them); `fillable` ones the agent may set
# via submit_job's `sbatch` arg, within `max`. job-name/output/chdir are always
# set by the orchestrator.
# [compute.slurm]
# preamble = ["module load julia"]
# fixed = { account = "my_account", partition = "mit_normal" }
# [compute.slurm.fillable.time]
# default = "01:00:00"
# max = "12:00:00"
# [compute.slurm.fillable.cpus-per-task]
# default = 4
# max = 48
